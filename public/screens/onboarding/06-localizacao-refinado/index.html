<!DOCTYPE html>

<style>

            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
<link rel="preload" href="/assets/fonts/inter-latin-f11d729b.woff2" as="font" type="font/woff2" crossorigin>

<style>
.pb-back-galeria{position:fixed;left:0;top:50%;transform:translateY(-50%);

<body class="bg-surface text-on-surface min-h-screen flex items-center justify-center p-container-margin selection:bg-primary-container selection:text-on-primary-container">
<!-- Navigation Shell suppressed because this is a Transactional/Onboarding screen -->
<main class="w-full max-w-[400px] bg-surface-container-lowest rounded-[24px] overflow-hidden shadow-lg border border-outline-variant/30 flex flex-col h-[751px] max-h-[800px] md:h-auto md:min-h-[600px] relative">
<!-- Illustration / Graphic Area -->
<div class="relative w-full h-[40%] bg-surface-container-low overflow-hidden">
<div class="absolute inset-0 bg-cover bg-center w-full h-full opacity-60 mix-blend-multiply" style="background-image: url('/assets/img/map-abstract.svg')"></div>
<div class="absolute inset-0 bg-surface-container-lowest/40"></div>
<!-- Floating Marker Decoration -->
<div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 bg-primary rounded-full p-md shadow-lg animate-bounce border-4 border-surface-container-lowest">
<span aria-hidden="true" data-icon="location_on" class="material-symbols-outlined text-on-primary text-[32px]" style="font-variation-settings: 'FILL' 1;">&#xe0c8;</span>
</div>
<!-- Gradient Overlay for smooth transition -->
<div class="absolute bottom-0 left-0 w-full h-32 bg-gradient-to-t from-surface-container-lowest via-surface-container-lowest/80 to-transparent"></div>
</div>
<!-- Content Area -->
<div class="flex-1 flex flex-col px-lg pt-sm pb-xl">
<div class="text-center mb-auto pt-sm flex flex-col gap-sm">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-surface">
                    Descubra as melhores opções perto de você
                </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-[300px] mx-auto">
                    Ao compartilhar sua localização, encontramos os postos mais baratos e pontos de recarga na sua região.
                </p>
</div>
<!-- Action Buttons -->
<div class="flex flex-col gap-md mt-xl">
<button type="button" class="w-full min-h-[56px] bg-primary hover:bg-primary-container text-on-primary hover:text-on-primary-container font-label-bold text-[14px] leading-[20px] rounded-[16px] transition-colors duration-200 shadow-md hover:shadow-lg flex items-center justify-center gap-sm group">
<span aria-hidden="true" data-icon="my_location" class="material-symbols-outlined text-[20px] group-active:scale-90 transition-transform">&#xe1b3;</span>
                    Permitir localização
                </button>
<button type="button" class="w-full min-h-[56px] bg-transparent border border-outline-variant text-primary hover:bg-surface-container hover:border-primary font-label-bold text-[14px] leading-[20px] rounded-[16px] transition-all duration-200 flex items-center justify-center gap-sm">
<span aria-hidden="true" data-icon="search" class="material-symbols-outlined text-[20px]">&#xe8b6;</span>
                    Buscar cidade manualmente
                </button>
<button type="button" class="w-full min-h-[48px] bg-transparent text-secondary hover:text-on-surface hover:bg-surface-container-highest font-label-bold text-label-bold rounded-[12px] transition-colors duration-200 mt-sm">
                    Agora não
                </button>
</div>
</div>
</main>
<a href="/" class="pb-back-galeria" title="Voltar para a galeria de telas">
<span aria-hidden="true">&#x2190;</span> Galeria
</a>
