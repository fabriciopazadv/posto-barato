</div>
</div>

</div>

<button class="absolute right-sm top-1/2 -translate-y-1/2 text-secondary px-2 hover:text-on-surface transition-colors flex items-center justify-center" type="button" aria-label="Mostrar senha">
<span aria-hidden="true" data-icon="visibility_off" class="material-symbols-outlined">&#xe8f5;</span>
</button>
</div>
</div>
