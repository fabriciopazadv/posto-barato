<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Página não encontrada — Posto Barato</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#006c49" />
  <link rel="icon" href="/assets/img/logo-mark.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/assets/fonts/fonts.css" />
  <style>
    :root {
      --primary: #006c49; --on-primary: #fff; --surface: #f8f9ff;
      --on-surface: #121c28; --on-surface-variant: #3c4a42;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --primary: #4edea3; --on-primary: #002113; --surface: #101820;
        --on-surface: #eaf1ff; --on-surface-variant: #bbcabf;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background: var(--surface); color: var(--on-surface);
      font-family: Inter, system-ui, -apple-system, sans-serif;
      padding: 24px; text-align: center;
    }
    .box { max-width: 420px; }
    img { width: 72px; height: 72px; }
    h1 {
      font-family: Manrope, Inter, sans-serif;
      font-size: 28px; font-weight: 800; letter-spacing: -0.02em;
      margin: 20px 0 8px;
    }
    p { color: var(--on-surface-variant); line-height: 1.6; margin: 0 0 24px; }
    a {
      display: inline-block; background: var(--primary); color: var(--on-primary);
      text-decoration: none; font-weight: 700; font-size: 14px;
      padding: 12px 22px; border-radius: 9999px;
    }
    a:focus-visible { outline: 3px solid var(--on-surface); outline-offset: 3px; }
  </style>
</head>
<body>
  <div class="box">
    <img src="/assets/img/logo-mark.svg" alt="" width="72" height="72" />
    <h1>Página não encontrada</h1>
    <p>
      Este endereço não existe na galeria de protótipos do Posto Barato.
      O código-fonte da plataforma fica no repositório, não neste site.
    </p>
    <a href="/">Voltar para a galeria</a>
  </div>
</body>
</html>
