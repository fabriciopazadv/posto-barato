services:
  # PostgreSQL 16 + PostGIS 3.4 — a mesma linha maior de versão do banco do
  # coletor. Um único banco lógico (`posto_barato`) para tudo: o coletor escreve
  # em public.*, a Fase 2 lê pelas views collector.* e mantém o schema app.
  # Criar um segundo banco lógico impediria as views de enxergarem as tabelas.
  #
  # TROCAR ESTA IMAGEM EM UM BANCO QUE JÁ TEM DADOS NÃO É UMA EDIÇÃO DE YAML.
  # O procedimento (backup, validação do volume, PostGIS_Version, migrações e
  # plano de rollback) está em docs/operations/database-integration.md.
  # Subir PostgreSQL 17 sobre um volume escrito pelo 16 faz o container
  # encerrar com erro de incompatibilidade — o volume não é migrado sozinho.
  postgres:
    image: postgis/postgis:16-3.4
    container_name: posto-barato-db
    environment:
      POSTGRES_USER: posto_barato
      POSTGRES_PASSWORD: posto_barato
      POSTGRES_DB: posto_barato
    ports:
      - "5432:5432"
    volumes:
      # Caminho do PGDATA do PostgreSQL 16. Mudar este caminho torna os dados
      # existentes invisíveis para o servidor, que inicializa um cluster vazio.
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U posto_barato -d posto_barato"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: posto-barato-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: runtime
    container_name: posto-barato-api
    environment:
      # A API fala com o MESMO PostgreSQL definido acima, pelo nome de serviço na
      # rede do compose — não sobe um segundo servidor nem disputa a porta 5432
      # do host. Cada papel tem a sua credencial; os defaults abaixo são o
      # usuário único do ambiente local, e `.env` os sobrescreve quando os papéis
      # restritos já foram provisionados (operations/roles.sql + grants.sql).
      # Nomes próprios (COMPOSE_*) para que as URLs do `.env`, que apontam para
      # `localhost` e servem ao `pnpm dev:api` do host, não sejam herdadas por um
      # container onde `localhost` é ele mesmo.
      DATABASE_READONLY_URL: ${COMPOSE_DATABASE_READONLY_URL:-postgresql://posto_barato:posto_barato@postgres:5432/posto_barato}
      DATABASE_APP_URL: ${COMPOSE_DATABASE_APP_URL:-postgresql://posto_barato:posto_barato@postgres:5432/posto_barato}
      # DATABASE_MIGRATION_URL e DATABASE_REFRESH_URL NÃO entram aqui, de
      # propósito: quem migra e quem atualiza a projeção são comandos (estágio
      # `tools` do Dockerfile), não o processo que atende a internet.
      REDIS_URL: redis://redis:6379
      NODE_ENV: development
      API_HOST: 0.0.0.0
      API_PORT: "3333"
      # Obrigatório e sem default: um segredo de autenticação escrito em arquivo
      # versionado vale o mesmo que segredo nenhum. Gere com
      # `openssl rand -base64 48` e guarde em `.env`, que não vai para o Git.
      AUTH_ACCESS_SECRET: ${AUTH_ACCESS_SECRET:?defina AUTH_ACCESS_SECRET no arquivo .env (openssl rand -base64 48)}
      # Sem HTTPS no ambiente local do compose.
      COOKIE_SECURE: "false"
      APP_URL: http://localhost:3333
    ports:
      - "3333:3333"
    # Sem curl/wget na imagem slim: o próprio Node faz a requisição.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3333/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles: ["full"]

volumes:
  pgdata:
